name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Benchmarks
        run: go test ./... -run '^$' -bench . -benchtime 1s | tee bench.txt
      - uses: actions/upload-artifact@v5
        with:
          name: bench
          path: bench.txt
