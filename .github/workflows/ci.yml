name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: go fix makes no changes
        run: go fix ./... && git diff --exit-code
      - uses: ./.github/actions/datasets
      # The real-data tests skip without PBT_DATASETS; none may skip for that reason here.
      - name: Test with the real datasets
        # Unlike the default shell, sets pipefail, so a failing test piped into tee fails the step.
        shell: bash
        run: |
          go test -race -v ./... | tee "$RUNNER_TEMP/test.log"
          if grep -q 'PBT_DATASETS not set' "$RUNNER_TEMP/test.log"; then
            echo "::error::real-data tests skipped: PBT_DATASETS not set"
            exit 1
          fi
          echo "Tests and subtests: $(grep -c -e '--- PASS' "$RUNNER_TEMP/test.log") passed, $(grep -c -e '--- SKIP' "$RUNNER_TEMP/test.log") skipped, none for want of PBT_DATASETS" | tee -a "$GITHUB_STEP_SUMMARY"
      # Once each, so a broken benchmark fails; times on a shared runner are not judged.
      - name: Run every benchmark once
        run: go test -run '^$' -bench . -benchtime 1x ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # The engine runs as WebAssembly in a browser worker. This job keeps it building for js/wasm
  # and runs the simulator's TestProbe natively and as js/wasm on a real dataset; the two results
  # must be byte-identical. Module size and probe times are reported, not gated.
  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Unlike the default shell, sets pipefail, so a failing test piped into tee fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: go build ./...
        env:
          GOOS: js
          GOARCH: wasm
      - run: go vet ./...
        env:
          GOOS: js
          GOARCH: wasm
      - uses: ./.github/actions/datasets
      - name: Probe, native
        env:
          PBT_PROBE_OUT: ${{ runner.temp }}/probe-native.json
        run: go test ./simulator -run '^TestProbe$' -count=1 -v | tee "$RUNNER_TEMP/native.log"
      - name: Probe, js/wasm
        # The wasm test binary has hung after PASS before; the probe itself takes seconds.
        timeout-minutes: 5
        env:
          PBT_PROBE_OUT: ${{ runner.temp }}/probe-wasm.json
        run: |
          GOOS=js GOARCH=wasm go test -c -o "$RUNNER_TEMP/simulator.test.wasm" ./simulator
          cd simulator
          "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" "$RUNNER_TEMP/simulator.test.wasm" -test.run '^TestProbe$' -test.v | tee "$RUNNER_TEMP/wasm.log"
      - name: Native and js/wasm results are identical
        run: |
          cd "$RUNNER_TEMP"
          if ! cmp probe-native.json probe-wasm.json; then
            diff -u probe-native.json probe-wasm.json | head -100
            exit 1
          fi
      - name: Report module size and probe times
        run: |
          cd "$RUNNER_TEMP"
          size=$(node -e '
            const zlib = require("zlib"), b = require("fs").readFileSync(process.argv[1]);
            const c = zlib.brotliCompressSync(b, {params: {[zlib.constants.BROTLI_PARAM_QUALITY]: 11, [zlib.constants.BROTLI_PARAM_SIZE_HINT]: b.length}});
            console.log(`${(b.length / 1e6).toFixed(2)} MB, ${(c.length / 1e6).toFixed(2)} MB brotli`);
          ' simulator.test.wasm)
          {
            echo "### WebAssembly"
            echo
            echo "- simulator test module (probe, its tests and the testing package): $size"
            grep -ho 'probe [a-z0-9]*/[a-z0-9]*: .*' native.log wasm.log | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
